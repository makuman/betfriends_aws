<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Title</title>
</head>
<body>
{% include "header.html" %}
<h1>Schedule</h1>
<div class="container"> <!-- Wrap your table in a container -->
        <table class="table table-bordered"> <!-- Add Bootstrap table class and table-bordered class -->
            <thead>
                <tr>
                    <th>DAY</th>
                    <th>DATE</th>
                    <th>TIME</th>
                    <th>HOME</th>
                    <th>AWAY</th>
                    <th>STADIUM</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row['DAY'] }}</td>
                    <td>{{ row['DATE'] }}</td>
                    <td>{{ row['TIME'] }}</td>
                    <td>{{ row['HOME'] }}</td>
                    <td>{{ row['AWAY'] }}</td>
                    <td>{{ row['STADIUM'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
{% include "footer.html" %}
</body>
</html>
