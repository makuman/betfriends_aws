<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collection Data</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        th {
            background-color: #6c757d; /* Change background color of table header */
            color: #ffffff; /* Set text color of table header */
        }
        tr:first-child th {
            background-color: #b9b0c9; /* Darker color for first row */
        }
    </style>
</head>
<body>
    {% include "header.html" %}
    <div class="container">
        <h1>Schedule</h1>
        <table class="table table-bordered">
            <thead class="table-light"> <!-- Use the table-light class to apply the existing table header styling -->
                <tr>
                    <th>Match Number</th>
                    <th>Day</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Home</th>
                    <th>Away</th>
                    <th>Stadium</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row['MATCH_NUMBER'] }}</td>
                    <td>{{ row['DAY'] }}</td>
                    <td>{{ row['DATE'] }}</td>
                    <td>{{ row['TIME'] }}</td>
                    <td>{{ row['HOME'] }}</td>
                    <td>{{ row['AWAY'] }}</td>
                    <td>{{ row['STADIUM'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% include "footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
